# Large tarballs (next, @next/swc) exceed the 60 s default on slow Wi-Fi.
fetchTimeout: 600000

# Trust the Windows certificate store too: Norton's HTTPS scanning re-signs ZooWork/Band
# certificates with its own root, which Node rejects by default.
nodeOptions: --use-system-ca

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@zoowork-ai/sdk@0.10.2'
